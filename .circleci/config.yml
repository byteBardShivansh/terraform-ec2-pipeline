# Use CircleCI's 2.1 pipeline engine
version: 2.1

# Define reusable jobs
jobs:
  terraform-validate:
    docker:
      - image: hashicorp/terraform:1.4.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Terraform Init
          command: terraform init -input=false
      - run:
          name: Terraform Format Check
          command: terraform fmt -check -diff
      - run:
          name: Terraform Validate
          command: terraform validate

  terraform-plan:
    docker:
      - image: hashicorp/terraform:1.4.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Terraform Init
          command: terraform init -input=false
      - run:
          name: Terraform Plan
          command: terraform plan -input=false -out=tfplan
      - persist_to_workspace:
          root: .
          paths:
            - tfplan

  terraform-apply:
    docker:
      - image: hashicorp/terraform:1.4.0
    working_directory: ~/project
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Terraform Init
          command: terraform init -input=false
      - run:
          name: Terraform Apply
          command: terraform apply -input=false -auto-approve tfplan

  terraform-destroy:
    docker:
      - image: hashicorp/terraform:1.4.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Terraform Init
          command: terraform init -input=false
      - run:
          name: Terraform Destroy
          command: terraform destroy -auto-approve

# Define the workflow that orchestrates the jobs
workflows:
  terraform-workflow:
    jobs:
      - terraform-validate
      - terraform-plan:
          requires:
            - terraform-validate
      - terraform-apply:
          requires:
            - terraform-plan
          filters:
            branches:
              only: main
      - terraform-destroy:
          requires:
            - terraform-apply
          filters:
            branches:
              only: main